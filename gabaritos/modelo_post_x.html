<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gabarito demonstrativo</title><style>:root{--bg:#fff;--fg:#0f1419;--mut:#536471;--line:#eff3f4;--bord:#cfd9de;--acc:#1d9bf0;--poll:#d6e9f8;--pollw:#8ecdf8}@media (prefers-color-scheme:dark){:root{--bg:#000;--fg:#e7e9ea;--mut:#71767b;--line:#2f3336;--bord:#2f3336;--poll:#14334a;--pollw:#1d6fa5}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}main{max-width:720px;margin:0 auto;padding:24px 16px 64px}h1{font-size:2rem;line-height:1.2;margin:.6em 0 .3em}a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
.author{display:flex;align-items:center;gap:12px;margin:8px 0}.author img.av{width:48px;height:48px;border-radius:50%;flex:none}.who{line-height:1.3}.name{color:var(--fg);font-weight:700;display:inline-flex;align-items:center;gap:3px}.badge{width:18px;height:18px;flex:none}.handle{color:var(--mut);font-size:.95rem}
.meta{color:var(--mut);font-size:.95rem;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:24px}
.post{display:grid;grid-template-columns:48px 1fr;column-gap:12px;position:relative;padding-bottom:20px}.post .rail{position:relative}.post .rail img{width:48px;height:48px;border-radius:50%;display:block}.post.thread .rail:after{content:"";position:absolute;left:23px;top:52px;bottom:-24px;width:2px;background:var(--bord)}.post .head{line-height:1.3;margin-bottom:4px}.post .text p{margin:.2em 0 .6em}.metrics{color:var(--mut);font-size:.85rem;margin-top:8px}
figure{margin:12px 0}figure img,figure video{display:block;width:100%;height:auto;border-radius:16px;border:1px solid var(--bord);background:#000}figcaption{color:var(--mut);font-size:.85rem;margin-top:6px}
.quote{display:block;border:1px solid var(--bord);border-radius:16px;padding:12px;margin:12px 0;color:var(--fg)}.quote .qhead{display:flex;align-items:center;gap:6px;font-size:.95rem;line-height:1.2}.quote .qhead img{width:20px;height:20px;border-radius:50%}.quote .qhead .badge{width:16px;height:16px}.quote .qtext{font-size:.95rem;margin-top:4px}.quote img.qmedia{width:100%;border-radius:12px;border:1px solid var(--bord);margin-top:10px;display:block}
.poll{margin:12px 0}.opt{position:relative;border-radius:6px;overflow:hidden;margin:6px 0;height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:.95rem}.opt .bar{position:absolute;left:0;top:0;bottom:0;background:var(--poll);border-radius:6px;z-index:0}.opt.win .bar{background:var(--pollw)}.opt span{position:relative;z-index:1}.opt.win span{font-weight:700}.pollfoot{color:var(--mut);font-size:.85rem}
.card{display:block;border:1px solid var(--bord);border-radius:16px;overflow:hidden;margin:12px 0;color:var(--fg)}.card img{display:block;width:100%;aspect-ratio:1.91/1;object-fit:cover;border-bottom:1px solid var(--bord)}.card .cbody{padding:10px 12px;line-height:1.35}.card .dom{color:var(--mut);font-size:.85rem}.card .ttl{font-size:.95rem}.card .desc{color:var(--mut);font-size:.85rem}
.foot{color:var(--mut);font-size:.8rem;border-top:1px solid var(--line);margin-top:32px;padding-top:12px}</style></head><body><main><article class="post"><div class="rail"></div><div><div class="author"><strong>Autor de exemplo</strong></div><p>Publicação fictícia para demonstrar o formato.</p></div></article></main></body></html>
