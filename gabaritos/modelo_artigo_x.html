<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gabarito demonstrativo</title><style>:root{--bg:#fff;--fg:#0f1419;--mut:#536471;--line:#eff3f4;--acc:#1d9bf0}@media (prefers-color-scheme:dark){:root{--bg:#000;--fg:#e7e9ea;--mut:#71767b;--line:#2f3336}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}main{max-width:720px;margin:0 auto;padding:24px 16px 64px}h1{font-size:2rem;line-height:1.2;margin:.6em 0 .3em}h2{font-size:1.6rem;margin:1.6em 0 .5em}h3{font-size:1.25rem;margin:1.6em 0 .5em}.meta{color:var(--mut);font-size:.95rem;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:24px}.meta a{color:var(--acc)}figure{margin:16px 0}figure img,figure video{display:block;width:100%;height:auto;border-radius:12px;background:#000}figcaption{color:var(--mut);font-size:.85rem;margin-top:6px}ol,ul{padding-left:1.4em}li{margin:.3em 0}a{color:var(--acc)}.author{display:flex;align-items:center;gap:12px;margin:8px 0 12px}.author img.av{width:48px;height:48px;border-radius:50%;flex:none}.who{line-height:1.3}.name{color:var(--fg);font-weight:700;display:inline-flex;align-items:center;gap:3px}.badge{width:18px;height:18px;flex:none}.handle{color:var(--mut);font-size:.95rem}.foot{color:var(--mut);font-size:.8rem;border-top:1px solid var(--line);margin-top:32px;padding-top:12px}</style></head><body><main><h1>Artigo demonstrativo</h1><p>Conteúdo fictício para testar o formato de exportação.</p><h2>Seção de exemplo</h2><p>Este gabarito não contém perfis ou publicações reais.</p></main></body></html>
